[project]
name = "stoic-eln"
version = "2.0.0a1"
description = "Lab notebook, refactored. An electronic lab notebook for organic chemists."
authors = [
    {name = "Riccardo Di Rosso"}
]
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"

dependencies = [
    "flask>=3.0,<4.0",
    "flask-sqlalchemy>=3.1,<4.0",
    "flask-login>=0.6.3,<1.0",
    "flask-wtf>=1.2,<2.0",
    "flask-babel>=4.0,<5.0",
    "flask-migrate>=4.0,<5.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "argon2-cffi>=23.1,<24.0",
    "python-dotenv>=1.0,<2.0",
    "wtforms>=3.1,<4.0",
    "email-validator>=2.0,<3.0",
    "babel>=2.14,<3.0",
    "httpx>=0.27,<1.0",
    "cachetools>=5.3,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-flask>=1.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "respx>=0.21",
]
prod = [
    "gunicorn>=22.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stoic_eln*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # function calls in argument defaults (Flask common pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
