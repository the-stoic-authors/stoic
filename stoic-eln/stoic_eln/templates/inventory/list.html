{% extends "base.html" %}
{% block title %}{{ _("Magazzino") }}{% endblock %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center mb-3">
  <div>
    <h1>{{ _("Magazzino") }}</h1>
    <p class="text-muted mb-0">{{ _("%(n)d lotti", n=items|length) }}</p>
  </div>
  <div>
    <a href="{{ url_for('substances.list_view') }}" class="btn btn-outline-primary">
      <i data-lucide="flask-conical"></i> {{ _("Catalogo sostanze") }}
    </a>
  </div>
</div>

<div class="card mb-3">
  <div class="card-body">
    <form method="get" class="row g-3 align-items-center">
      <div class="col-md-8">
        <input type="search"
               class="form-control"
               name="q"
               value="{{ q }}"
               placeholder="{{ _('Cerca per lotto, fornitore, posizione, sostanza, CAS…') }}"
               hx-get="{{ url_for('inventory.list_view') }}"
               hx-trigger="keyup changed delay:300ms, search"
               hx-target="#inventory-table"
               hx-include="this, [name=show_inactive]"
               autofocus>
      </div>
      <div class="col-md-3">
        <div class="form-check">
          <input class="form-check-input"
                 type="checkbox"
                 name="show_inactive"
                 value="1"
                 id="show_inactive"
                 {% if show_inactive %}checked{% endif %}
                 hx-get="{{ url_for('inventory.list_view') }}"
                 hx-trigger="change"
                 hx-target="#inventory-table"
                 hx-include="[name=q], this">
          <label class="form-check-label" for="show_inactive">
            {{ _("Mostra inattivi") }}
          </label>
        </div>
      </div>
      <div class="col-md-1">
        <button type="submit" class="btn btn-secondary w-100">
          <i data-lucide="search"></i>
        </button>
      </div>
    </form>
  </div>
</div>

<div id="inventory-table">
  {% include "inventory/_list_table.html" %}
</div>
{% endblock %}
