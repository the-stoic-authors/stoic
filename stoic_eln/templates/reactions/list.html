{% extends "base.html" %}
{% block title %}{{ _("Reazioni") }}{% endblock %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center mb-3">
  <div>
    <h1>{{ _("Reazioni") }}</h1>
    <p class="text-muted mb-0">{{ _("%(n)d reazioni", n=reactions|length) }}</p>
  </div>
  <div>
    <form method="post" action="{{ url_for('reactions.create') }}" class="d-inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn btn-primary">
        <i data-lucide="plus"></i> {{ _("Nuova reazione") }}
      </button>
    </form>
  </div>
</div>

<div class="card mb-3 stoic-sticky-search">
  <div class="card-body">
    <form method="get" class="row g-3 align-items-center">
      <div class="col-md-8">
        <input type="search"
               class="form-control"
               name="q"
               value="{{ q }}"
               placeholder="{{ _('Cerca per codice, titolo, sostanza, CAS, fonte…') }}"
               hx-get="{{ url_for('reactions.list_view') }}"
               hx-trigger="keyup changed delay:300ms, search"
               hx-target="#reactions-table"
               hx-include="this, [name=show_inactive]"
               autofocus>
      </div>
      <div class="col-md-3">
        <div class="form-check">
          <input class="form-check-input"
                 type="checkbox"
                 name="show_inactive"
                 value="1"
                 id="show_inactive"
                 {% if show_inactive %}checked{% endif %}
                 hx-get="{{ url_for('reactions.list_view') }}"
                 hx-trigger="change"
                 hx-target="#reactions-table"
                 hx-include="[name=q], this">
          <label class="form-check-label" for="show_inactive">
            {{ _("Mostra disattivate") }}
          </label>
        </div>
      </div>
      <div class="col-md-1">
        <button type="submit" class="btn btn-secondary w-100">
          <i data-lucide="search"></i>
        </button>
      </div>
    </form>
  </div>
</div>

<div id="reactions-table" class="stoic-sticky-thead">
  {% include "reactions/_list_table.html" %}
</div>
{% endblock %}
